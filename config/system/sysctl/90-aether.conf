# AetherOS low-latency / low-memory defaults.
# ZRAM is the only swap. Tune for responsiveness on eMMC and 2 GB RAM.

# Prefer compressed RAM over disk I/O.
vm.swappiness = 180
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.min_free_kbytes = 16384

# Keep dirty writeback small so a slow eMMC does not stall the desktop.
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 500
vm.vfs_cache_pressure = 150

# Desktop responsiveness.
kernel.sched_autogroup_enabled = 1
kernel.sched_child_runs_first = 0
kernel.sched_cfs_bandwidth_slice_us = 3000
kernel.perf_event_paranoid = 2

# Chromium sandbox, bubblewrap, Wine prefixes.
kernel.unprivileged_userns_clone = 1
kernel.apparmor_restrict_unprivileged_userns = 0

# Network latency (BBR is built into Debian kernels).
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3

# Avoid inotify exhaustion with Chromium + Wine + Waydroid.
fs.inotify.max_user_watches = 262144
fs.inotify.max_user_instances = 1024
