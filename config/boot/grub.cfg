set timeout=5
set default=0
set gfxmode=auto
set gfxpayload=keep

insmod all_video
insmod gfxterm
insmod png
terminal_output gfxterm

menuentry "AetherOS 0.1 (Nimbus) — Live" {
    linux /live/vmlinuz boot=live components live-media-path=/live quiet loglevel=3 preempt=full
    initrd /live/initrd.img
}

menuentry "AetherOS — Live (safe graphics)" {
    linux /live/vmlinuz boot=live components live-media-path=/live quiet loglevel=3 preempt=full nomodeset
    initrd /live/initrd.img
}

menuentry "AetherOS — Live with persistence (AETHER-DATA)" {
    linux /live/vmlinuz boot=live components live-media-path=/live persistence persistence-label=AETHER-DATA quiet loglevel=3 preempt=full
    initrd /live/initrd.img
}

menuentry "AetherOS — Install / rescue shell" {
    linux /live/vmlinuz boot=live components live-media-path=/live quiet loglevel=3 preempt=full systemd.unit=multi-user.target
    initrd /live/initrd.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
