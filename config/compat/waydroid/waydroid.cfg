# AetherOS Waydroid sample configuration.
# Waydroid writes the live file to /var/lib/waydroid/waydroid.cfg during
# `waydroid init`. Copy this file there only if you need to override defaults.
#
# Key points for AetherOS:
#   - multi_windows=true gives each Android app a floating, resizable window
#   - VANILLA images (no Google apps) keep the footprint and privacy sane
#   - ARM translation is NOT configured: libndk/libhoudini are proprietary

[waydroid]
arch = x86_64
vendor_type = MAINLINE
system_datetime = 0
vendor_datetime = 0
suspend_action = freeze
mount_overlays = True
auto_adb = False
images_path = /var/lib/waydroid/images
binder = binder
vndbinder = vndbinder
hwbinder = hwbinder
system_ota = https://ota.waydro.id/system/lineage/waydroid_x86_64/VANILLA.json
vendor_ota = https://ota.waydro.id/vendor/waydroid_x86_64/MAINLINE.json
binder_protocol = aidl3
service_manager_protocol = aidl3
