# AetherOS: make newly connected audio devices (such as Bluetooth headphones,
# e.g. JLab Go Pods ANC) become the default sink/source automatically.
# Without this, PipeWire keeps the previous default and the user has to switch
# manually in a mixer.

context.exec = [
    { path = "pactl" args = "load-module module-switch-on-connect" }
]